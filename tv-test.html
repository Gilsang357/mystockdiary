<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>tv test</title>
<style>body{font-family:sans-serif;margin:16px;background:#fff}.w{border:1px solid #ccc;margin:10px 0;padding:4px}h3{margin:6px 0;font-size:14px}</style></head><body>
<script>
const tests=[
 ['mini KRX:005930','embed-widget-mini-symbol-overview.js',{symbol:'KRX:005930',width:'100%',height:180,locale:'kr',dateRange:'1D',colorTheme:'light',isTransparent:false,autosize:false}],
 ['mini KRX:KOSPI','embed-widget-mini-symbol-overview.js',{symbol:'KRX:KOSPI',width:'100%',height:180,locale:'kr',dateRange:'1D',colorTheme:'light'}],
 ['symbol-info KRX:000660','embed-widget-symbol-info.js',{symbol:'KRX:000660',width:'100%',locale:'kr',colorTheme:'light',isTransparent:false}],
 ['single-quote KRX:005380','embed-widget-single-quote.js',{symbol:'KRX:005380',width:'100%',locale:'kr',colorTheme:'light'}],
 ['tickers KRX','embed-widget-tickers.js',{symbols:[{proName:'KRX:005930',title:'삼성전자'},{proName:'KRX:000660',title:'SK하이닉스'},{proName:'KRX:KOSPI',title:'코스피'}],colorTheme:'light',locale:'kr',isTransparent:false,showSymbolLogo:true}],
 ['mini NASDAQ:NVDA (control)','embed-widget-mini-symbol-overview.js',{symbol:'NASDAQ:NVDA',width:'100%',height:180,locale:'kr',dateRange:'1D',colorTheme:'light'}]
];
for(const [name,file,cfg] of tests){ const d=document.createElement('div'); d.className='w'; d.innerHTML='<h3>'+name+'</h3><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>'; document.body.append(d);
 const s=document.createElement('script'); s.src='https://s3.tradingview.com/external-embedding/'+file; s.async=true; s.text=JSON.stringify(cfg); d.querySelector('.tradingview-widget-container').append(s); }
</script></body></html>
